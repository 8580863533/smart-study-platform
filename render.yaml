services:
  # Python Flask Backend — native runtime (faster build than Docker on free tier)
  - type: web
    name: smart-study-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt && python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('stopwords'); nltk.download('averaged_perceptron_tagger')"
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////data/studytutor.db
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: USE_LOCAL_MODELS
        value: "false"
      - key: UPLOAD_FOLDER
        value: /data/uploads
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
