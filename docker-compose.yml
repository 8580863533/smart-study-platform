version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=dev-secret-key-replace-in-prod
      - JWT_SECRET_KEY=dev-jwt-secret-key-replace-in-prod
      - DATABASE_URL=sqlite:///studytutor.db
      - FLASK_ENV=development
      - FLASK_DEBUG=true
      - USE_LOCAL_MODELS=false
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend:/app # mounts code for live-reload in dev mode
    restart: always

